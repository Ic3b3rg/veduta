name: Release

# Signed self-update (issue #43, docs/adr/0013-signed-self-update.md, "Amendments"): CI builds
# and attests the release artifact but NEVER holds the signing key -- signing and feed
# promotion are local maintainer steps (deploy/release.sh, documented end-to-end in
# RELEASING.md). This workflow's only output is a DRAFT GitHub release carrying the tarball
# plus an UNSIGNED release.json; a human runs `deploy/release.sh sign` against it next.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      # The full gate against the tagged commit, exactly as ci.yml runs it on main -- a tag
      # that fails this is not released at all. `pnpm build` here also produces
      # packages/pwa/dist, which the assembly step below reuses as-is.
      - name: Full gate
        run: |
          set -euo pipefail
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$TAG' is not 'v<major>.<minor>.<patch>'" >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "artifact-name=veduta-v${version}-linux.tar.gz" >>"$GITHUB_OUTPUT"

      # Every deployed instance runs from source via tsx (deploy/install.sh's ExecStart), so
      # the only place VEDUTA_VERSION ever becomes a real number is this stamp -- the source
      # tree and every test always see the '0.0.0-dev' placeholder
      # (packages/daemon/src/version.ts).
      - name: Stamp daemon version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/export const VEDUTA_VERSION = '0\.0\.0-dev'/export const VEDUTA_VERSION = '${VERSION}'/" \
            packages/daemon/src/version.ts
          grep -q "VEDUTA_VERSION = '${VERSION}'" packages/daemon/src/version.ts

      # dataVersion is read from the daemon's own data-version module rather than hand-copied
      # into this workflow, so the two can never drift: whatever CURRENT_DATA_VERSION the
      # tagged commit actually ships with is what gets signed into release.json.
      - name: Read current dataVersion
        id: data-version
        run: |
          set -euo pipefail
          data_version=$(pnpm --filter @veduta/daemon exec tsx -e "
            import { CURRENT_DATA_VERSION } from './src/update/data-version.ts'
            process.stdout.write(String(CURRENT_DATA_VERSION))
          ")
          if ! [[ "$data_version" =~ ^[0-9]+$ ]]; then
            echo "error: could not read a numeric CURRENT_DATA_VERSION (got '$data_version')" >&2
            exit 1
          fi
          echo "value=$data_version" >>"$GITHUB_OUTPUT"

      # Node runtime measurement: the release manifest signs nodeTarSize/nodeSha256/
      # nodeUnpackedSize (packages/protocol/src/update.ts, ReleaseMetadataSchema) so the
      # updater's disk guardrail (docs/adr/0013-signed-self-update.md, Amendments) can reserve
      # space for a runtime jump *before* downloading anything, and so `ensureRuntime`
      # (packages/daemon/src/update/update-transaction.ts) can verify the runtime it downloads
      # byte-for-byte against these signed fields. A documented multiplier estimate was
      # rejected during design -- this step actually downloads the pinned Node build (once per
      # release, not per install) and measures it directly.
      #
      # This MUST be the exact artifact `ensureRuntime` fetches: `node-v<version>-linux-<arch>
      # .tar.gz` -- the `.tar.gz`, never the `.tar.xz` (a different file, with a different size
      # and hash, that the updater never touches).
      #
      # Arch: `ReleaseMetadataSchema` carries one set of runtime fields, not one per CPU
      # architecture, while `ensureRuntime` requests `linux-${process.arch}` on whatever host
      # is actually running the update. This step measures `linux-x64` -- the architecture of
      # this reference platform (`ubuntu-latest`) -- as a deliberate simplification: an
      # instance updating from a `linux-arm64` host would ask the Node dist server for a
      # differently-sized, differently-hashed `linux-arm64` tarball that these signed fields do
      # not describe, and `ensureRuntime`'s exact size/sha256 checks would then refuse it
      # outright rather than merely running a wider disk-guardrail margin. Documented here and
      # in RELEASING.md; revisit (e.g. per-arch fields) once arm64 hosts are a real deployment
      # target rather than a theoretical one.
      - name: Measure Node runtime tarball
        id: node-runtime
        run: |
          set -euo pipefail
          node_version=$(tr -d '[:space:]' <.node-version)
          base="node-v${node_version}-linux-x64"
          dist="https://nodejs.org/dist/v${node_version}"
          work=$(mktemp -d)
          curl -fsSL -o "$work/$base.tar.gz" "$dist/$base.tar.gz"
          curl -fsSL -o "$work/SHASUMS256.txt" "$dist/SHASUMS256.txt"
          (cd "$work" && grep " ${base}.tar.gz\$" SHASUMS256.txt | sha256sum -c -)
          tar_size=$(stat -c%s "$work/$base.tar.gz")
          sha256=$(sha256sum "$work/$base.tar.gz" | cut -d' ' -f1)
          mkdir "$work/extracted"
          tar -xzf "$work/$base.tar.gz" -C "$work/extracted"
          unpacked_size=$(du -sb "$work/extracted" | cut -f1)
          rm -rf "$work"
          echo "node-version=$node_version" >>"$GITHUB_OUTPUT"
          echo "tar-size=$tar_size" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          echo "unpacked-size=$unpacked_size" >>"$GITHUB_OUTPUT"

      # --- Artifact assembly -------------------------------------------------------------
      #
      # supportedArchitectures mechanism: there is no `pnpm install --config.supportedArchitectures=...`
      # CLI flag -- pnpm only reads this setting from `pnpm-workspace.yaml` (or a root
      # package.json `pnpm` block). This step appends it to the workspace file for the
      # duration of this job only (never committed) and re-installs so the resolved
      # node_modules carries BOTH linux-x64 and linux-arm64 optional-dependency binaries
      # (esbuild, the only native dep tsx pulls in) -- one artifact, two CPU architectures,
      # per docs/adr/0013-signed-self-update.md's Amendments section. This assumes the
      # committed pnpm-lock.yaml's dependency graph already lists both platforms' optional
      # packages (true today, since npm registry
      # metadata for esbuild's optional dependencies is platform-list-complete regardless of
      # which machine generated the lockfile) -- if a future `pnpm install` ever needs to
      # *resolve* a platform pnpm hasn't seen before, this step would need
      # `--no-frozen-lockfile` instead, which would also mean re-committing the lockfile.
      - name: Enable both CPU architectures for the assembled artifact
        run: |
          set -euo pipefail
          cat >>pnpm-workspace.yaml <<'EOF'
          supportedArchitectures:
            os:
              - linux
            cpu:
              - x64
              - arm64
          EOF

      - name: Reinstall with both architectures (runnable-tree artifact deps)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Assemble the artifact tree
        id: assemble
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact-name }}
        run: |
          set -euo pipefail

          # Deterministic file list: every git-tracked file at this tag (sources + configs,
          # stamped version.ts included -- tar reads working-tree bytes, not the git blob),
          # plus the prebuilt PWA dist (untracked, produced by the gate's `pnpm build`), plus
          # every resolved node_modules tree in the workspace (root + each package's own,
          # pnpm's relative in-tree symlink forest -- ground truth confirmed during design:
          # a plain tar of the checkout is self-contained). `.git` itself is never listed:
          # `git ls-files` only lists tracked paths, never the `.git` directory.
          {
            git ls-files
            find packages/pwa/dist -mindepth 1
            find . \( -path '*/node_modules' -o -path '*/node_modules/*' \) -not -path './.git/*'
          } | sort -u >file-list.txt

          # --no-recursion: file-list.txt above already expands every directory to its full
          # set of descendants (both `find` invocations walk recursively and `-mindepth 1`/the
          # `-o` clause list every entry, not just top-level directories). Without
          # --no-recursion, `tar -T` additionally auto-recurses into every directory entry it
          # is given, re-adding each of its descendants a second time -- inflating the actual
          # archive's entry count and total bytes silently past whatever gets signed below.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --no-recursion \
            -czf "$ARTIFACT_NAME" -T file-list.txt

          artifact_size=$(stat -c%s "$ARTIFACT_NAME")
          sha256=$(sha256sum "$ARTIFACT_NAME" | cut -d' ' -f1)

          echo "artifact-name=$ARTIFACT_NAME" >>"$GITHUB_OUTPUT"
          echo "artifact-size=$artifact_size" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      # entryCount/unpackedSize are derived from the BUILT ARCHIVE ITSELF, using the exact
      # counting rule the updater's own preflight applies (`preflightArchive`,
      # packages/daemon/src/update/tar-reader.ts) -- not a bash approximation (`wc -l`/`du`)
      # that could silently drift from it. `preflightArchive` counts one entry per yielded tar
      # entry (files, dirs, symlinks, hardlinks -- PAX/GNU-long-name header records are never
      # yielded as entries of their own) and sums bytes only for `file`-type entries, so this
      # is the only way to guarantee the signed numbers can never reject the very artifact they
      # describe. The policy passed here is deliberately unbounded: this step measures, it does
      # not gate -- a real bound is enforced for real by the updater at install time, against
      # these derived numbers.
      - name: Derive entryCount/unpackedSize from the built artifact
        id: counts
        env:
          ARTIFACT_PATH: ${{ github.workspace }}/${{ steps.assemble.outputs.artifact-name }}
        run: |
          set -euo pipefail
          result=$(pnpm --filter @veduta/daemon exec tsx -e "
            import { preflightArchive } from './src/update/tar-reader.ts'
            preflightArchive(process.env.ARTIFACT_PATH ?? '', {
              maxEntries: Number.MAX_SAFE_INTEGER,
              maxUnpackedBytes: Number.MAX_SAFE_INTEGER,
            }).then((result) => {
              process.stdout.write(JSON.stringify(result))
            }).catch((error) => {
              console.error(error)
              process.exit(1)
            })
          ")
          echo "preflightArchive result: $result"
          entry_count=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).entries))" "$result")
          unpacked_size=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).unpackedBytes))" "$result")
          if ! [[ "$entry_count" =~ ^[0-9]+$ ]]; then
            echo "error: could not derive a numeric entryCount (got '$entry_count')" >&2
            exit 1
          fi
          if ! [[ "$unpacked_size" =~ ^[0-9]+$ ]]; then
            echo "error: could not derive a numeric unpackedSize (got '$unpacked_size')" >&2
            exit 1
          fi
          echo "entry-count=$entry_count" >>"$GITHUB_OUTPUT"
          echo "unpacked-size=$unpacked_size" >>"$GITHUB_OUTPUT"

      - name: Release notes from the tag message
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # `actions/checkout` leaves the tag as a ref pointing straight at the commit unless the
          # annotated tag *object* is fetched too, and `%(contents)` on such a ref returns the
          # COMMIT message instead of the tag message -- which is what shipped as v0.0.1's notes.
          # Fetching the tag ref explicitly brings the annotated object along; a lightweight tag
          # still falls back to the commit subject, which is the best available text.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")
          {
            echo 'text<<VEDUTA_NOTES_EOF'
            echo "$notes"
            echo 'VEDUTA_NOTES_EOF'
          } >>"$GITHUB_OUTPUT"

      # release.json -- the canonical bytes the maintainer's `deploy/release.sh sign` step
      # signs next. Built with Node's JSON.stringify (correct escaping for the free-text
      # `notes` field) rather than hand-assembled, and matches ReleaseMetadataSchema
      # (packages/protocol/src/update.ts) field-for-field, including `nodeSha256` -- the
      # updater verifies the downloaded Node runtime tarball against this signed hash directly,
      # rather than trusting the `SHASUMS256.txt` fetched from the same dist host it just
      # downloaded the tarball from. Deliberately UNSIGNED: CI never holds the signing key
      # (docs/adr/0013-signed-self-update.md, "Considered options" -- "CI-held signing key:
      # rejected").
      - name: Write unsigned release.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ steps.assemble.outputs.artifact-name }}
          SHA256: ${{ steps.assemble.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.assemble.outputs.artifact-size }}
          UNPACKED_SIZE: ${{ steps.counts.outputs.unpacked-size }}
          ENTRY_COUNT: ${{ steps.counts.outputs.entry-count }}
          DATA_VERSION: ${{ steps.data-version.outputs.value }}
          NODE_VERSION: ${{ steps.node-runtime.outputs.node-version }}
          NODE_TAR_SIZE: ${{ steps.node-runtime.outputs.tar-size }}
          NODE_SHA256: ${{ steps.node-runtime.outputs.sha256 }}
          NODE_UNPACKED_SIZE: ${{ steps.node-runtime.outputs.unpacked-size }}
          NOTES: ${{ steps.notes.outputs.text }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs')
            const release = {
              version: process.env.VERSION,
              artifactName: process.env.ARTIFACT_NAME,
              sha256: process.env.SHA256,
              artifactSize: Number(process.env.ARTIFACT_SIZE),
              unpackedSize: Number(process.env.UNPACKED_SIZE),
              entryCount: Number(process.env.ENTRY_COUNT),
              dataVersion: Number(process.env.DATA_VERSION),
              nodeVersion: process.env.NODE_VERSION,
              nodeTarSize: Number(process.env.NODE_TAR_SIZE),
              nodeSha256: process.env.NODE_SHA256,
              nodeUnpackedSize: Number(process.env.NODE_UNPACKED_SIZE),
              notes: process.env.NOTES ?? '',
            }
            fs.writeFileSync('release.json', JSON.stringify(release, null, 2) + '\n')
          "
          cat release.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.assemble.outputs.artifact-name }}

      # Draft only: a human still has to sign it (deploy/release.sh sign), upload the
      # .minisig, then publish. See RELEASING.md for the rest of the per-release ceremony.
      - name: Upload draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          body: ${{ steps.notes.outputs.text }}
          files: |
            ${{ steps.assemble.outputs.artifact-name }}
            release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
