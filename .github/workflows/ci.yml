name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
        # Serialize files on shared runners. Tests retain their concurrent operations,
        # assertions and deadlines.
        env:
          VITEST_MAX_THREADS: 1
          VITEST_MAX_FORKS: 1
      - run: pnpm build
      - run: pnpm --filter @veduta/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @veduta/e2e run test:e2e
